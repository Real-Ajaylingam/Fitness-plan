<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBuddy - AI Workout Generator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="hero-bg">
  <div class="overlay">
    <div class="card">
      <h1>FitBuddy</h1>
      <p class="subtitle">AI-Powered Fitness Plan Generator</p>

      <form action="/generate-workout" method="post">
        <label for="username">Name</label>
        <input type="text" id="username" name="username" required />

        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id" required />

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="119" required />

        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight" min="1" step="0.1" required />

        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
          <option value="weight loss">Weight Loss</option>
          <option value="muscle gain">Muscle Gain</option>
          <option value="general wellness">General Wellness</option>
          <option value="flexibility">Flexibility</option>
        </select>

        <label for="intensity">Workout Intensity</label>
        <select id="intensity" name="intensity" required>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <button type="submit">Generate Plan</button>
      </form>

      <p class="admin-link"><a href="/view-all-users">View all users (admin)</a></p>
    </div>
  </div>
</body>
</html>
